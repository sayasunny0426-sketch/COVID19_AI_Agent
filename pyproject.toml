[project]
name = "covid19-ai-agent"
version = "0.2.0"
description = "COVID-19 in-hospital mortality prediction from admission chest radiographs (Task A), clinical table data (Task B) and their late fusion (Task C)"
requires-python = ">=3.10"
# scikit-learn, scipy, statsmodels and xgboost are runtime dependencies, not dev extras:
# Task B fits the models with them and Task C's paired DeLong needs scipy.
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydicom>=3.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.uv]
package = false
